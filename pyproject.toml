[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-pokedex"
version = "0.1.0"
description = "Semantic search scaffolding for Pokémon using pgvector and multiple representation strategies"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "requests>=2.31",
  "sentence-transformers>=2.6",
  "streamlit>=1.32",
  "numpy>=1.26",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.8",
  "types-requests>=2.31",
  "types-PyYAML>=6.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
